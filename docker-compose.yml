version: "3.8"

# Single-node ELK stack for local development and demo purposes.
# NOT a production security-hardened deployment: Elasticsearch has no auth
# enabled here for simplicity of local `docker compose up`. Kibana is the
# only service that should ever be exposed beyond localhost - see
# docs/architecture.md for the intended network boundary in a real deployment.

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: soc-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false   # dev/demo only - see docs/architecture.md
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"   # bound to localhost only, not 0.0.0.0
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - soc-net

  logstash:
    image: docker.elastic.co/logstash/logstash:8.14.3
    container_name: soc-logstash
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./ingest/logstash/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
      - ./ingest/logstash/conf.d:/usr/share/logstash/pipeline/conf.d:ro
      - ./tests/fixtures:/data/ss7:ro   # mount generated event fixtures for demo runs
    networks:
      - soc-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.3
    container_name: soc-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"   # the only port meant to ever be exposed
    networks:
      - soc-net

volumes:
  esdata:

networks:
  soc-net:
    driver: bridge
