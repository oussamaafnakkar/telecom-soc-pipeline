title: SIM Swap Indicator - MAP UpdateLocation from Untrusted Global Title
name: sim_swap_update_location_untrusted
id: f26eca46-0d38-4fb8-89ca-6b1d2054b34d
status: experimental
description: |
  Detects a MAP UPDATE-LOCATION (opcode 2) sent to the HLR from a Global Title
  that is not on the operator's trusted interconnect list. This is step 1 of the
  technical SIM swap in SBC post #8, Part 3: the attacker claims to be the new
  serving MSC, the HLR cancels the real registration and routes the subscriber's
  SMS, including bank OTPs, to the attacker.
  On its own this can also be an attempt to track or disrupt a subscriber. The
  correlation rule sim-swap-correlation.yml raises the severity when it is
  followed by a call-forwarding change for the same IMSI.
references:
    - https://www.sbytec.com/vulnerabilities/sim-swapping/
author: Secure Byte Chronicles
date: 2026/11/02
tags:
    - sbc.post.sim-swapping
logsource:
    category: telecom_signaling
    product: ss7_map
detection:
    selection:
        signaling_protocol: 'MAP'
        map_opcode: 2
        src_gt_trusted_partner: false
    condition: selection
falsepositives:
    - >-
      A newly onboarded roaming partner whose GT is not yet on the trusted list.
      Check the interconnect agreement registry before escalating.
    - >-
      Legitimate UPDATE-LOCATION from a roaming partner is the most common MAP
      operation there is. The rule only matches sources outside the trusted list,
      so the quality of that list decides the false-positive rate.
level: high
