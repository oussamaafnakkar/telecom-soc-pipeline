title: SS7 MAP AnyTimeInterrogation from Untrusted Global Title
id: 8f2b6b1a-4e2e-4a4a-9c3a-1a2f3c4d5e6f
status: experimental
description: |
  Detects MAP anyTimeInterrogation (ATSI, opcode 71) requests originating from a
  Global Title that is not on the operator's trusted interconnect/roaming partner
  list. ATSI returns subscriber location and state, and is the primary MAP
  operation abused for SS7-based location tracking (see SBC blog post #2:
  SS7 Location Disclosure).
references:
    - https://www.sbytec.com/vulnerabilities/ss7-explainer/
author: Secure Byte Chronicles
date: 2026/08/27
tags:
    - attack.reconnaissance
    # Technique-level MITRE FiGHT / ATT&CK IDs are deliberately not listed until
    # they are verified against fight.mitre.org. See docs/mapping-table.md.
logsource:
    category: telecom_signaling
    product: ss7_map
detection:
    selection:
        signaling_protocol: 'MAP'
        map_opcode: 71
        src_gt_trusted_partner: false
    condition: selection
falsepositives:
    - Newly onboarded roaming/interconnect partners whose GT has not yet been
      added to the trusted-partner allowlist. Verify against the interconnect
      agreement registry before treating as confirmed malicious.
    - Legitimate lawful-intercept or operator-internal location queries issued
      from a GT outside the standard partner range - confirm against internal
      LI/OSS system GT allowlist.
level: high
