# Ingests newline-delimited JSON GSM cell measurements (produced by
# generators/imsi_catcher_generator.py, or by radio-monitoring sensors in
# production) and tags the ones that match the IMSI catcher Sigma rules.
#
# Detection logic mirrors:
#   detections/sigma/imsi-catcher-critical-indicator.yml
#   detections/sigma/imsi-catcher-weak-indicator-combo.yml

input {
  file {
    path => "/data/imsi/*.jsonl"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    # The file input already splits lines, so use json here, not json_lines.
    codec => "json"
    tags => ["imsi_catcher"]
  }
}

filter {
  if "imsi_catcher" in [tags] {
    mutate {
      add_field => {
        "[event][category]" => "network"
        "[event][dataset]" => "gsm.cell_measurement"
      }
    }

    # Rule 1: IND-01 (fingerprint LAC) or IND-03 (A5/0 on a Moroccan carrier).
    # Logstash has no list-of-numbers shortcut we can rely on, so every LAC value
    # is written out. Either branch alone is enough.
    if [lac] == 0 or [lac] == 1 or [lac] == 65533 or [lac] == 65534 or [lac] == 65535 or ([mcc] == 604 and ([mnc] == 0 or [mnc] == 1 or [mnc] == 2) and [encryption] == "A5/0") {
      mutate {
        add_tag => ["sigma_match_imsi_catcher_critical_indicator"]
        add_field => {
          "[rule][critical][id]" => "4dd9eee1-e6bf-4d6c-8c68-8a10ab4701a1"
          "[rule][critical][level]" => "critical"
        }
      }
    }

    # Rule 2: IND-04 and IND-05 and IND-06 together. `![field]` means "this
    # boolean field is false" (Logstash has no true/false literals).
    if ![auth_requested] and [neighbor_count] < 2 and ![cell_in_inventory] and [rssi_dbm] > -55 {
      mutate {
        add_tag => ["sigma_match_imsi_catcher_weak_indicator_combo"]
        add_field => {
          "[rule][weak_combo][id]" => "7a43adf0-09c6-48cf-b7ee-519a532ea72f"
          "[rule][weak_combo][level]" => "high"
        }
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "imsi-catcher-%{+YYYY.MM.dd}"
  }
  # Uncomment for local debugging:
  # stdout { codec => rubydebug }
}
