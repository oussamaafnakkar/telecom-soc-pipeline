# Ingests newline-delimited JSON SS7/MAP signaling events (produced by
# generators/ss7_atsi_generator.py, or a real probe/mediation feed in
# production) and indexes them for the Sigma-rule-equivalent Kibana alert.
#
# Local/dev input reads a file path; in a real deployment this would be a
# Kafka/Filebeat input from the actual signaling probe instead.

input {
  file {
    path => "/data/ss7/*.jsonl"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    # The file input already splits lines, so use json here. json_lines waits for
    # a newline that never arrives and emits nothing.
    codec => "json"
    tags => ["ss7_signaling"]
  }
}

filter {
  if "ss7_signaling" in [tags] {
    # The json_lines codec already parses the "@timestamp" field of each event,
    # so no date filter is needed here.

    mutate {
      add_field => {
        "[event][category]" => "network"
        "[event][dataset]" => "ss7.map"
      }
    }

    # Direct re-implementation of detections/sigma/ss7-location-disclosure.yml
    # `selection` block, so the same event that lands in Elasticsearch is
    # already tagged for the Kibana alert rule to pick up.
    #
    # Logstash conditionals have no true/false literals, so a boolean field is
    # tested by itself: `![field]` is true when the field is false. This is why
    # the Sigma rule says `src_gt_trusted_partner: false` but this line does not.
    if [signaling_protocol] == "MAP" and [map_opcode] == 71 and ![src_gt_trusted_partner] {
      mutate {
        add_tag => ["sigma_match_ss7_location_disclosure"]
        add_field => { "[rule][id]" => "8f2b6b1a-4e2e-4a4a-9c3a-1a2f3c4d5e6f" }
        add_field => { "[rule][name]" => "SS7 MAP AnyTimeInterrogation from Untrusted Global Title" }
        add_field => { "[rule][level]" => "high" }
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "ss7-signaling-%{+YYYY.MM.dd}"
  }
  # Uncomment for local debugging:
  # stdout { codec => rubydebug }
}
