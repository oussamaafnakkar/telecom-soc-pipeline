# Ingests newline-delimited JSON GTPv2-C events (produced by
# generators/gtp_generator.py, or by a GRX/IPX border probe in production) and
# tags the events that match the two single-event Sigma rules:
#
#   detections/sigma/gtp-session-op-untrusted-peer.yml
#   detections/sigma/gtp-serving-network-mismatch.yml
#
# The bearer exhaustion rule counts distinct IMSIs per source over time, which a
# Logstash filter cannot do, so it is NOT evaluated here. See
# docs/code-walkthrough.md.

input {
  file {
    path => "/data/gtp/*.jsonl"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    # The file input already splits lines, so use json here, not json_lines.
    codec => "json"
    tags => ["gtp"]
  }
}

filter {
  if "gtp" in [tags] {
    mutate {
      add_field => {
        "[event][category]" => "network"
        "[event][dataset]" => "gtp.control"
      }
    }

    # Create Session (32) or Modify Bearer (34) from a peer without a roaming
    # agreement. `![field]` means "this boolean is false".
    if [signaling_protocol] == "GTPv2-C" and ([gtp_message_type] == 32 or [gtp_message_type] == 34) and ![src_peer_trusted] {
      mutate {
        add_tag => ["sigma_match_gtp_session_op_untrusted_peer"]
        add_field => {
          "[rule][untrusted_peer][id]" => "80d56740-74e3-448b-9136-a4bbfb491d5b"
          "[rule][untrusted_peer][level]" => "high"
        }
      }
    }

    # Create Session whose claimed serving network is not the sender's own.
    # Comparing two fields directly is what Sigma's `fieldref` modifier expresses.
    if [signaling_protocol] == "GTPv2-C" and [gtp_message_type] == 32 and [serving_network_plmn] != [src_peer_plmn] {
      mutate {
        add_tag => ["sigma_match_gtp_serving_network_mismatch"]
        add_field => {
          "[rule][serving_mismatch][id]" => "0276fe76-25c1-43fa-afe6-52b073c81f04"
          "[rule][serving_mismatch][level]" => "high"
        }
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "gtp-security-%{+YYYY.MM.dd}"
  }
  # Uncomment for local debugging:
  # stdout { codec => rubydebug }
}
