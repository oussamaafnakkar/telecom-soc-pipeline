# Ingests newline-delimited JSON MAP events for the SIM swap scenario (produced
# by generators/sim_swap_generator.py, or by a signaling probe in production)
# and tags the events that match the two single-event Sigma rules:
#
#   detections/sigma/sim-swap-update-location-untrusted.yml
#   detections/sigma/sim-swap-register-ss-cfu-untrusted.yml
#
# The third rule, sim-swap-correlation.yml, needs more than one event, so it is
# NOT evaluated here. Logstash judges one event at a time. See
# docs/code-walkthrough.md for how the correlation is checked.

input {
  file {
    path => "/data/simswap/*.jsonl"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    # The file input already splits lines, so use json here, not json_lines.
    codec => "json"
    tags => ["sim_swap"]
  }
}

filter {
  if "sim_swap" in [tags] {
    mutate {
      add_field => {
        "[event][category]" => "network"
        "[event][dataset]" => "ss7.map"
      }
    }

    # MAP UPDATE-LOCATION (opcode 2) from a GT that is not a trusted partner.
    # `![field]` means "this boolean is false" (Logstash has no true/false literals).
    if [signaling_protocol] == "MAP" and [map_opcode] == 2 and ![src_gt_trusted_partner] {
      mutate {
        add_tag => ["sigma_match_sim_swap_update_location_untrusted"]
        add_field => {
          "[rule][update_location][id]" => "f26eca46-0d38-4fb8-89ca-6b1d2054b34d"
          "[rule][update_location][level]" => "high"
        }
      }
    }

    # MAP REGISTER-SS (opcode 10) setting call forwarding unconditional
    # (ss-Code 33 = 0x21) from a GT that is not a trusted partner.
    if [signaling_protocol] == "MAP" and [map_opcode] == 10 and [ss_code] == 33 and ![src_gt_trusted_partner] {
      mutate {
        add_tag => ["sigma_match_sim_swap_register_ss_cfu_untrusted"]
        add_field => {
          "[rule][register_ss_cfu][id]" => "c78132bc-4133-4505-bcfb-7396186da141"
          "[rule][register_ss_cfu][level]" => "high"
        }
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "sim-swap-%{+YYYY.MM.dd}"
  }
  # Uncomment for local debugging:
  # stdout { codec => rubydebug }
}
