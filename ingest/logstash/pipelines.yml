# One pipeline per attack scenario, so a bad rule or config for one scenario
# cannot take down ingestion for the others.
- pipeline.id: ss7-signaling
  path.config: "/usr/share/logstash/pipeline/conf.d/ss7.conf"

- pipeline.id: imsi-catcher
  path.config: "/usr/share/logstash/pipeline/conf.d/imsi.conf"

