name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-validate:
    name: Lint and validate configs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml ruff

      - name: Lint Python (ruff)
        run: ruff check generators/ detections/ scripts/

      - name: Check shell script syntax
        run: for f in scripts/*.sh; do sh -n "$f"; done

      - name: Validate Sigma rule YAML syntax
        run: |
          python3 - <<'EOF'
          import sys, yaml, glob
          required = {"title", "id", "status", "logsource", "detection", "level"}
          ok = True
          for path in glob.glob("detections/sigma/*.yml"):
              with open(path) as f:
                  rule = yaml.safe_load(f)
              missing = required - rule.keys()
              if missing:
                  print(f"FAIL {path}: missing required fields {missing}")
                  ok = False
              else:
                  print(f"OK   {path}")
          sys.exit(0 if ok else 1)
          EOF

      - name: Validate docker-compose config
        run: docker compose config --quiet

  detection-tests:
    name: Detection tests (in Docker, no ELK)
    runs-on: ubuntu-latest
    needs: lint-and-validate
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build tools image
        run: make build

      - name: Run detection tests
        run: make test

  end-to-end-elk-test:
    name: End-to-end ELK integration test
    runs-on: ubuntu-latest
    needs: detection-tests
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: make up

      - name: Verify the pipeline end to end
        run: make verify

      - name: Show service logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: make reset
